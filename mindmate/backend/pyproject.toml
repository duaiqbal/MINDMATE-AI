[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmate-backend"
version = "0.0.0"
description = "MindMate AI backend (non-diagnostic well-being chat)"
requires-python = ">=3.11"

# Pinned per tech.md. Versions verified against PyPI; pip install will fail
# loudly if any pin is unavailable.
dependencies = [
    "fastapi==0.162.0",        # web framework (starlette>=1.3 security fixes)
    "uvicorn==0.34.0",         # ASGI server (run the app)
    "pydantic==2.10.4",        # models + validation
    "pydantic-settings==2.7.0",# env-driven settings (Pydantic v2 split this out)
    "pyyaml==6.0.2",           # load the auditable reasoning decision table
    "httpx==0.28.1",           # HTTP client for the LLM provider API (also TestClient transport)
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",           # test runner (PYSEC-2026-1845 fix)
    "ruff==0.8.4",             # linter
    "sqlglot==26.0.1",         # parse/validate SQL migrations without a live DB
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Exclude the local ephemeral DB dirs and the venv.
extend-exclude = [".venv", ".pg_verify", ".pg_test", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI uses Depends()/Query()/Path() as argument defaults by design; this is
# the documented pattern, so exempt them from flake8-bugbear B008.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]